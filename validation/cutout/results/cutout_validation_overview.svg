<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 652"><style>text{font-family:Calibri,"Microsoft JhengHei",sans-serif}</style><rect x="0.0" y="0.0" width="1180.0" height="652.0" fill="#0b1119" rx="16"/><text x="34.0" y="44.0" fill="#e8eef6" font-size="27" font-weight="700">裁切等效性驗證總覽</text><text x="34.0" y="72.0" fill="#9fb0c3" font-size="14">指標：裁切後與「同一片不裁切」的插入損耗偏差（0～10 GHz）。橫條為對數尺度，越短越好。</text><text x="620.0" y="118.0" fill="#6f8195" font-size="11" text-anchor="middle">0.01</text><text x="783.0" y="118.0" fill="#6f8195" font-size="11" text-anchor="middle">0.1</text><text x="946.1" y="118.0" fill="#6f8195" font-size="11" text-anchor="middle">1</text><text x="1060.0" y="118.0" fill="#6f8195" font-size="11" text-anchor="end">5 dB</text><line x1="897.0" y1="128.0" x2="897.0" y2="508.0" stroke="#ffb020" stroke-width="1.6" stroke-dasharray="5 4"/><text x="905.0" y="118.0" fill="#ffb020" font-size="11">0.5 dB 判定門檻</text><text x="34.0" y="174.0" fill="#e8eef6" font-size="15.5">擴張 5 mm</text><text x="34.0" y="196.0" fill="#6f8195" font-size="12">保留平面 10.2 mm，縫合 Via 保留</text><text x="596.0" y="174.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="620.0" y1="170.0" x2="1060.0" y2="170.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="620.0" y1="170.0" x2="655.9" y2="170.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="669.9" y="175.0" fill="#9fb0c3" font-size="12">最大 0.0166 dB</text><text x="34.0" y="252.0" fill="#e8eef6" font-size="15.5">擴張 3 mm</text><text x="34.0" y="274.0" fill="#6f8195" font-size="12">保留平面 6.2 mm，縫合 Via 保留</text><text x="596.0" y="252.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="620.0" y1="248.0" x2="1060.0" y2="248.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="620.0" y1="248.0" x2="659.2" y2="248.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="673.2" y="253.0" fill="#9fb0c3" font-size="12">最大 0.0174 dB</text><text x="34.0" y="330.0" fill="#e8eef6" font-size="15.5">擴張 2 mm</text><text x="34.0" y="352.0" fill="#6f8195" font-size="12">保留平面 4.2 mm，縫合 Via 保留</text><text x="596.0" y="330.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="620.0" y1="326.0" x2="1060.0" y2="326.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="620.0" y1="326.0" x2="691.4" y2="326.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="705.4" y="331.0" fill="#9fb0c3" font-size="12">最大 0.0274 dB</text><text x="34.0" y="408.0" fill="#e8eef6" font-size="15.5">擴張 1 mm（縫合 Via 被切掉）</text><text x="34.0" y="430.0" fill="#6f8195" font-size="12">保留平面 2.2 mm，42 個縫合 Via 全被移除</text><text x="596.0" y="408.0" fill="#ff6b6b" font-size="14" font-weight="700" text-anchor="end">FAIL</text><line x1="620.0" y1="404.0" x2="1060.0" y2="404.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="620.0" y1="404.0" x2="981.2" y2="404.0" stroke="#ff6b6b" stroke-width="12" stroke-linecap="round"/><text x="969.2" y="409.0" fill="#12202b" font-size="12" font-weight="700" text-anchor="end">最大 1.6436 dB</text><text x="34.0" y="486.0" fill="#e8eef6" font-size="15.5">控制組：擴張 1 mm（縫合 Via 保留）</text><text x="34.0" y="508.0" fill="#6f8195" font-size="12">保留平面同樣 2.2 mm，但 Via 改放 Y ±0.8 mm 而留下</text><text x="596.0" y="486.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="620.0" y1="482.0" x2="1060.0" y2="482.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="620.0" y1="482.0" x2="716.7" y2="482.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="730.7" y="487.0" fill="#9fb0c3" font-size="12">最大 0.0392 dB</text><rect x="24.0" y="554.0" width="1132.0" height="52.0" fill="#131c27" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="576.0" fill="#e8eef6" font-size="14">結論：擴張距離本身不是關鍵——2 mm 與 5 mm 的差別只有 0.01 dB。</text><text x="44.0" y="598.0" fill="#e8eef6" font-size="14">真正會出事的是「裁切範圍把接地縫合 Via 切掉」：同樣 1 mm 擴張、同樣保留寬度，Via 被切掉 1.644 dB、Via 保留 0.039 dB，相差 42 倍。</text></svg>