<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 566"><style>text{font-family:Calibri,"Microsoft JhengHei",sans-serif}</style><rect x="0.0" y="0.0" width="1180.0" height="566.0" fill="#0b1119" rx="16"/><text x="34.0" y="44.0" fill="#e8eef6" font-size="27" font-weight="700">Layout 清理等效性驗證總覽</text><text x="34.0" y="72.0" fill="#9fb0c3" font-size="14">指標：清理後與「干擾物全部保留」的插入損耗偏差（0～10 GHz）。橫條為對數尺度。</text><text x="600.0" y="118.0" fill="#6f8195" font-size="11" text-anchor="middle">0.001</text><text x="753.3" y="118.0" fill="#6f8195" font-size="11" text-anchor="middle">0.01</text><text x="906.7" y="118.0" fill="#6f8195" font-size="11" text-anchor="middle">0.1</text><text x="1060.0" y="118.0" fill="#6f8195" font-size="11" text-anchor="end">1 dB</text><line x1="1013.8" y1="128.0" x2="1013.8" y2="426.0" stroke="#ffb020" stroke-width="1.6" stroke-dasharray="5 4"/><text x="1005.8" y="118.0" fill="#ffb020" font-size="11" text-anchor="end">0.5 dB 判定門檻</text><text x="34.0" y="174.0" fill="#e8eef6" font-size="15.5">保護距離 0.3 mm</text><text x="34.0" y="196.0" fill="#6f8195" font-size="12">移除 8 條干擾走線，保留 無（全部移除）</text><text x="576.0" y="174.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="600.0" y1="170.0" x2="1060.0" y2="170.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="600.0" y1="170.0" x2="803.1" y2="170.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="817.1" y="175.0" fill="#9fb0c3" font-size="12">最大 0.0211 dB</text><text x="34.0" y="250.0" fill="#e8eef6" font-size="15.5">保護距離 1.0 mm</text><text x="34.0" y="272.0" fill="#6f8195" font-size="12">移除 6 條干擾走線，保留 ±0.5 mm</text><text x="576.0" y="250.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="600.0" y1="246.0" x2="1060.0" y2="246.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="600.0" y1="246.0" x2="742.5" y2="246.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="756.5" y="251.0" fill="#9fb0c3" font-size="12">最大 0.0085 dB</text><text x="34.0" y="326.0" fill="#e8eef6" font-size="15.5">保護距離 3.0 mm</text><text x="34.0" y="348.0" fill="#6f8195" font-size="12">移除 4 條干擾走線，保留 ±0.5、±2.5 mm</text><text x="576.0" y="326.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="600.0" y1="322.0" x2="1060.0" y2="322.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="600.0" y1="322.0" x2="786.3" y2="322.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="800.3" y="327.0" fill="#9fb0c3" font-size="12">最大 0.0164 dB</text><text x="34.0" y="402.0" fill="#e8eef6" font-size="15.5">保護距離 6.0 mm</text><text x="34.0" y="424.0" fill="#6f8195" font-size="12">移除 2 條干擾走線，保留 ±0.5、±2.5、±5.0 mm</text><text x="576.0" y="402.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="600.0" y1="398.0" x2="1060.0" y2="398.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="600.0" y1="398.0" x2="793.9" y2="398.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="807.9" y="403.0" fill="#9fb0c3" font-size="12">最大 0.0184 dB</text><rect x="24.0" y="468.0" width="1132.0" height="52.0" fill="#131c27" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="490.0" fill="#e8eef6" font-size="14">結論：清理其他網路的銅箔對通道結果沒有可量測的影響——連距通道僅 0.5 mm 的干擾走線移除掉也一樣。</text><text x="44.0" y="512.0" fill="#e8eef6" font-size="14">四種保護距離的偏差都在 0.021 dB 以內，且沒有隨距離的趨勢，已屬網格數值雜訊等級。</text></svg>