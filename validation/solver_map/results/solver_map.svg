<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 778"><style>text{font-family:Calibri,"Microsoft JhengHei",sans-serif}</style><rect x="0.0" y="0.0" width="1240.0" height="778.0" fill="#0b1119" rx="16"/><text x="34.0" y="46.0" fill="#e8eef6" font-size="27" font-weight="700">SIwave 適用性地圖：哪些結構算得準</text><text x="34.0" y="74.0" fill="#9fb0c3" font-size="14">同一疊構、同一組 Port、縫合 Via 1 mm 網格，只有中段幾何不同。基準為收斂的 HFSS（寬頻自適應 1–20 GHz）。</text><text x="34.0" y="98.0" fill="#6f8195" font-size="12.5">數字＝SIwave 與 HFSS 的插入損耗最大偏差（dB）。綠 &lt;0.3　橘 0.3–1.0　紅 &gt;1.0</text><text x="545.0" y="150.0" fill="#9fb0c3" font-size="13" text-anchor="middle">0–5 GHz</text><text x="695.0" y="150.0" fill="#9fb0c3" font-size="13" text-anchor="middle">5–10 GHz</text><text x="845.0" y="150.0" fill="#9fb0c3" font-size="13" text-anchor="middle">10–20 GHz</text><text x="990.0" y="150.0" fill="#9fb0c3" font-size="13" text-anchor="middle">SIwave 可信到</text><text x="1196.0" y="150.0" fill="#9fb0c3" font-size="13" text-anchor="end">加速</text><rect x="24.0" y="170.0" width="1192.0" height="94.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="204.0" fill="#e8eef6" font-size="16.5" font-weight="700">純直線</text><text x="44.0" y="228.0" fill="#6f8195" font-size="12">規則走線，最單純的情形</text><text x="44.0" y="250.0" fill="#9fb0c3" font-size="11.5">SIwave 27s　HFSS 63 分</text><rect x="487.0" y="196.0" width="116.0" height="40.0" fill="#76e38e" rx="8" stroke="#76e38e" stroke-width="1.2" fill-opacity="0.14"/><text x="545.0" y="222.0" fill="#76e38e" font-size="17" font-weight="700" text-anchor="middle">0.016</text><rect x="637.0" y="196.0" width="116.0" height="40.0" fill="#76e38e" rx="8" stroke="#76e38e" stroke-width="1.2" fill-opacity="0.14"/><text x="695.0" y="222.0" fill="#76e38e" font-size="17" font-weight="700" text-anchor="middle">0.012</text><rect x="787.0" y="196.0" width="116.0" height="40.0" fill="#76e38e" rx="8" stroke="#76e38e" stroke-width="1.2" fill-opacity="0.14"/><text x="845.0" y="222.0" fill="#76e38e" font-size="17" font-weight="700" text-anchor="middle">0.123</text><text x="990.0" y="216.0" fill="#76e38e" font-size="16" font-weight="700" text-anchor="middle">全頻皆可</text><text x="990.0" y="236.0" fill="#6f8195" font-size="11" text-anchor="middle">到 20 GHz</text><text x="1196.0" y="222.0" fill="#00d4ff" font-size="18" font-weight="700" text-anchor="end">138×</text><rect x="24.0" y="278.0" width="1192.0" height="94.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="312.0" fill="#e8eef6" font-size="16.5" font-weight="700">繞道（四個直角轉彎）</text><text x="44.0" y="336.0" fill="#6f8195" font-size="12">平面內幾何，沒有離開層面</text><text x="44.0" y="358.0" fill="#9fb0c3" font-size="11.5">SIwave 27s　HFSS 56 分</text><rect x="487.0" y="304.0" width="116.0" height="40.0" fill="#76e38e" rx="8" stroke="#76e38e" stroke-width="1.2" fill-opacity="0.14"/><text x="545.0" y="330.0" fill="#76e38e" font-size="17" font-weight="700" text-anchor="middle">0.015</text><rect x="637.0" y="304.0" width="116.0" height="40.0" fill="#76e38e" rx="8" stroke="#76e38e" stroke-width="1.2" fill-opacity="0.14"/><text x="695.0" y="330.0" fill="#76e38e" font-size="17" font-weight="700" text-anchor="middle">0.010</text><rect x="787.0" y="304.0" width="116.0" height="40.0" fill="#76e38e" rx="8" stroke="#76e38e" stroke-width="1.2" fill-opacity="0.14"/><text x="845.0" y="330.0" fill="#76e38e" font-size="17" font-weight="700" text-anchor="middle">0.290</text><text x="990.0" y="324.0" fill="#76e38e" font-size="16" font-weight="700" text-anchor="middle">全頻皆可</text><text x="990.0" y="344.0" fill="#6f8195" font-size="11" text-anchor="middle">到 20 GHz</text><text x="1196.0" y="330.0" fill="#00d4ff" font-size="18" font-weight="700" text-anchor="end">122×</text><rect x="24.0" y="386.0" width="1192.0" height="94.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="420.0" fill="#e8eef6" font-size="16.5" font-weight="700">3 mm 開路殘段</text><text x="44.0" y="444.0" fill="#6f8195" font-size="12">共振結構——λ/4 約在 12.5 GHz</text><text x="44.0" y="466.0" fill="#9fb0c3" font-size="11.5">SIwave 27s　HFSS 51 分</text><rect x="487.0" y="412.0" width="116.0" height="40.0" fill="#76e38e" rx="8" stroke="#76e38e" stroke-width="1.2" fill-opacity="0.14"/><text x="545.0" y="438.0" fill="#76e38e" font-size="17" font-weight="700" text-anchor="middle">0.163</text><rect x="637.0" y="412.0" width="116.0" height="40.0" fill="#ff6b6b" rx="8" stroke="#ff6b6b" stroke-width="1.2" fill-opacity="0.14"/><text x="695.0" y="438.0" fill="#ff6b6b" font-size="17" font-weight="700" text-anchor="middle">1.025</text><rect x="787.0" y="412.0" width="116.0" height="40.0" fill="#ff6b6b" rx="8" stroke="#ff6b6b" stroke-width="1.2" fill-opacity="0.14"/><text x="845.0" y="438.0" fill="#ff6b6b" font-size="17" font-weight="700" text-anchor="middle">3.958</text><text x="990.0" y="432.0" fill="#ff6b6b" font-size="16" font-weight="700" text-anchor="middle">7.1 GHz</text><text x="990.0" y="452.0" fill="#6f8195" font-size="11" text-anchor="middle">之後失準</text><text x="1196.0" y="438.0" fill="#00d4ff" font-size="18" font-weight="700" text-anchor="end">113×</text><rect x="24.0" y="494.0" width="1192.0" height="94.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="528.0" fill="#e8eef6" font-size="16.5" font-weight="700">跨越參考平面分割</text><text x="44.0" y="552.0" fill="#6f8195" font-size="12">回流被切斷，需繞行裂縫</text><text x="44.0" y="574.0" fill="#9fb0c3" font-size="11.5">SIwave 26s　HFSS 55 分</text><rect x="487.0" y="520.0" width="116.0" height="40.0" fill="#76e38e" rx="8" stroke="#76e38e" stroke-width="1.2" fill-opacity="0.14"/><text x="545.0" y="546.0" fill="#76e38e" font-size="17" font-weight="700" text-anchor="middle">0.039</text><rect x="637.0" y="520.0" width="116.0" height="40.0" fill="#76e38e" rx="8" stroke="#76e38e" stroke-width="1.2" fill-opacity="0.14"/><text x="695.0" y="546.0" fill="#76e38e" font-size="17" font-weight="700" text-anchor="middle">0.284</text><rect x="787.0" y="520.0" width="116.0" height="40.0" fill="#ffb020" rx="8" stroke="#ffb020" stroke-width="1.2" fill-opacity="0.14"/><text x="845.0" y="546.0" fill="#ffb020" font-size="17" font-weight="700" text-anchor="middle">0.783</text><text x="990.0" y="540.0" fill="#ffb020" font-size="16" font-weight="700" text-anchor="middle">13.6 GHz</text><text x="990.0" y="560.0" fill="#6f8195" font-size="11" text-anchor="middle">之後失準</text><text x="1196.0" y="546.0" fill="#00d4ff" font-size="18" font-weight="700" text-anchor="end">129×</text><rect x="24.0" y="598.0" width="1192.0" height="78.0" fill="#131c27" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="624.0" fill="#76e38e" font-size="14">判讀：平面內的走線（直線、轉彎）SIwave 完全勝任到 20 GHz，而且快 120 倍以上。</text><text x="44.0" y="646.0" fill="#ffb020" font-size="14">會讓 SIwave 失準的是「回流被破壞」與「共振」：跨越平面分割撐到 13.6 GHz，開路殘段只到 7.1 GHz。</text><text x="44.0" y="668.0" fill="#9fb0c3" font-size="13">與直覺相反：殘段比平面分割更早失準——共振點附近的微小偏移會被放大成數 dB。</text><text x="1206.0" y="764.0" fill="#6f8195" font-size="11" text-anchor="end">此工具由虎門科技資深技術工程師 Jeff Hong 洪敬傑提供</text></svg>