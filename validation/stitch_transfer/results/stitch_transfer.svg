<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 866"><style>text{font-family:Calibri,"Microsoft JhengHei",sans-serif}</style><rect x="0.0" y="0.0" width="1240.0" height="866.0" fill="#0b1119" rx="16"/><text x="34.0" y="46.0" fill="#e8eef6" font-size="27" font-weight="700">λ/10 縫合規則：跨疊構是否仍然成立</text><text x="34.0" y="74.0" fill="#9fb0c3" font-size="14">固定縫合間距 2 mm、固定切面位置，只改疊構。線寬依各疊構重算維持 50 Ω。</text><text x="34.0" y="98.0" fill="#6f8195" font-size="12.5">淺色條＝規則預測的可信上限；亮點＝實測上限。預測必須落在實測左側（保守）。</text><text x="34.0" y="122.0" fill="#6f8195" font-size="12.5">公式 f = c /(10 · 等效間距 · √εr) 含 εr 但不含板厚——薄板與厚板兩組就是在檢驗這個省略。</text><line x1="470.0" y1="168.0" x2="470.0" y2="676.0" stroke="#1b2634" stroke-width="1"/><text x="470.0" y="162.0" fill="#6f8195" font-size="11" text-anchor="middle">0</text><line x1="592.0" y1="168.0" x2="592.0" y2="676.0" stroke="#1b2634" stroke-width="1"/><text x="592.0" y="162.0" fill="#6f8195" font-size="11" text-anchor="middle">2</text><line x1="714.0" y1="168.0" x2="714.0" y2="676.0" stroke="#1b2634" stroke-width="1"/><text x="714.0" y="162.0" fill="#6f8195" font-size="11" text-anchor="middle">4</text><line x1="836.0" y1="168.0" x2="836.0" y2="676.0" stroke="#1b2634" stroke-width="1"/><text x="836.0" y="162.0" fill="#6f8195" font-size="11" text-anchor="middle">6</text><line x1="958.0" y1="168.0" x2="958.0" y2="676.0" stroke="#1b2634" stroke-width="1"/><text x="958.0" y="162.0" fill="#6f8195" font-size="11" text-anchor="middle">8</text><line x1="1080.0" y1="168.0" x2="1080.0" y2="676.0" stroke="#1b2634" stroke-width="1"/><text x="1080.0" y="162.0" fill="#6f8195" font-size="11" text-anchor="middle">10</text><text x="1110.0" y="162.0" fill="#6f8195" font-size="11">GHz</text><rect x="24.0" y="176.0" width="1192.0" height="86.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="200.0" fill="#e8eef6" font-size="15.5" font-weight="700">基準 εr 4.0 / 250 µm</text><text x="44.0" y="222.0" fill="#6f8195" font-size="11.5">線寬 0.1963 mm</text><line x1="470.0" y1="202.0" x2="891.2" y2="202.0" stroke="#00d4ff" stroke-width="11" stroke-linecap="round"/><text x="883.2" y="206.0" fill="#0b1119" font-size="11" font-weight="700" text-anchor="end">6.91</text><circle cx="940.5" cy="202.0" r="8.0" fill="#76e38e"/><text x="956.5" y="207.0" fill="#76e38e" font-size="12.5" font-weight="700">實測 7.71 GHz  餘裕 10.5%</text><rect x="24.0" y="276.0" width="1192.0" height="86.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="300.0" fill="#e8eef6" font-size="15.5" font-weight="700">低介電 εr 3.0 / 250 µm</text><text x="44.0" y="322.0" fill="#6f8195" font-size="11.5">線寬 0.2563 mm</text><line x1="470.0" y1="302.0" x2="956.4" y2="302.0" stroke="#00d4ff" stroke-width="11" stroke-linecap="round"/><text x="948.4" y="306.0" fill="#0b1119" font-size="11" font-weight="700" text-anchor="end">7.97</text><circle cx="990.3" cy="302.0" r="8.0" fill="#76e38e"/><text x="1006.3" y="307.0" fill="#76e38e" font-size="12.5" font-weight="700">實測 8.53 GHz  餘裕 6.5%</text><rect x="24.0" y="376.0" width="1192.0" height="86.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="400.0" fill="#e8eef6" font-size="15.5" font-weight="700">高介電 εr 6.0 / 250 µm</text><text x="44.0" y="422.0" fill="#6f8195" font-size="11.5">線寬 0.1213 mm</text><line x1="470.0" y1="402.0" x2="813.9" y2="402.0" stroke="#00d4ff" stroke-width="11" stroke-linecap="round"/><text x="805.9" y="406.0" fill="#0b1119" font-size="11" font-weight="700" text-anchor="end">5.64</text><circle cx="861.1" cy="402.0" r="8.0" fill="#76e38e"/><text x="877.1" y="407.0" fill="#76e38e" font-size="12.5" font-weight="700">實測 6.41 GHz  餘裕 12.1%</text><rect x="24.0" y="476.0" width="1192.0" height="86.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="500.0" fill="#e8eef6" font-size="15.5" font-weight="700">薄板 εr 4.0 / 150 µm</text><text x="44.0" y="522.0" fill="#6f8195" font-size="11.5">線寬 0.1066 mm</text><line x1="470.0" y1="502.0" x2="891.2" y2="502.0" stroke="#00d4ff" stroke-width="11" stroke-linecap="round"/><text x="883.2" y="506.0" fill="#0b1119" font-size="11" font-weight="700" text-anchor="end">6.91</text><circle cx="902.9" cy="502.0" r="8.0" fill="#ffb020"/><text x="918.9" y="507.0" fill="#ffb020" font-size="12.5" font-weight="700">實測 7.10 GHz  餘裕 2.7%</text><rect x="24.0" y="576.0" width="1192.0" height="86.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="600.0" fill="#e8eef6" font-size="15.5" font-weight="700">厚板 εr 4.0 / 400 µm</text><text x="44.0" y="622.0" fill="#6f8195" font-size="11.5">線寬 0.3309 mm</text><line x1="470.0" y1="602.0" x2="891.2" y2="602.0" stroke="#00d4ff" stroke-width="11" stroke-linecap="round"/><text x="883.2" y="606.0" fill="#0b1119" font-size="11" font-weight="700" text-anchor="end">6.91</text><circle cx="897.7" cy="602.0" r="8.0" fill="#ffb020"/><text x="913.7" y="607.0" fill="#ffb020" font-size="12.5" font-weight="700">實測 7.01 GHz  餘裕 1.5%</text><rect x="24.0" y="690.0" width="1192.0" height="100.0" fill="#131c27" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="716.0" fill="#76e38e" font-size="14">εr 縮放正確：實測值乘上 √εr 得 14.77／15.43／15.70，三組落在 6% 內。</text><text x="44.0" y="740.0" fill="#76e38e" font-size="14">板厚可以忽略：三種板厚實測 7.10／7.71／7.01 GHz，變動 ±5% 且沒有單調趨勢。</text><text x="44.0" y="764.0" fill="#ffb020" font-size="14">但餘裕不平均——改 εr 有 7～12%，改板厚只剩 1.5～2.6%，已接近量測雜訊。</text><text x="44.0" y="786.0" fill="#9fb0c3" font-size="13">放行爛切面的代價（20 dB 假結果、使用者不會察覺）遠大於過度保守（多打幾顆 Via），建議改用 λ/12 取得餘裕。</text><text x="1206.0" y="852.0" fill="#6f8195" font-size="11" text-anchor="end">此工具由虎門科技資深技術工程師 Jeff Hong 洪敬傑提供</text></svg>