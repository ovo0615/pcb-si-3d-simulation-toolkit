<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620"><style>text{font-family:Calibri,"Microsoft JhengHei",sans-serif}</style><rect x="0.0" y="0.0" width="1240.0" height="620.0" fill="#0b1119" rx="16"/><text x="34.0" y="46.0" fill="#e8eef6" font-size="27" font-weight="700">同樣缺縫合，stripline 與微帶線差一個數量級</text><text x="34.0" y="74.0" fill="#9fb0c3" font-size="14">縱軸＝分段串接與整片求解的插入損耗最大偏差（對數刻度）。兩份研究用同一組間距、同一片尺寸、同一個判準。</text><text x="34.0" y="98.0" fill="#6f8195" font-size="12.5">stripline 的機制是「人為短路兩個原本不相連的參考面」，所以縫合有沒有做，結果差兩個數量級。</text><text x="34.0" y="120.0" fill="#00d4ff" font-size="12.5">微帶線沒有那件事：六種密度（14 顆到 0 顆）的結果一模一樣，縫合不是微帶線的變因。</text><line x1="150.0" y1="430.0" x2="1120.0" y2="430.0" stroke="#1b2634" stroke-width="1"/><text x="138.0" y="434.0" fill="#6f8195" font-size="11" text-anchor="end">0.01 dB</text><line x1="150.0" y1="351.0" x2="1120.0" y2="351.0" stroke="#1b2634" stroke-width="1"/><text x="138.0" y="355.0" fill="#6f8195" font-size="11" text-anchor="end">0.1 dB</text><line x1="150.0" y1="272.1" x2="1120.0" y2="272.1" stroke="#1b2634" stroke-width="1"/><text x="138.0" y="276.1" fill="#6f8195" font-size="11" text-anchor="end">1 dB</text><line x1="150.0" y1="193.1" x2="1120.0" y2="193.1" stroke="#1b2634" stroke-width="1"/><text x="138.0" y="197.1" fill="#6f8195" font-size="11" text-anchor="end">10 dB</text><line x1="150.0" y1="351.0" x2="1120.0" y2="351.0" stroke="#ffb020" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1120.0" y="343.0" fill="#ffb020" font-size="11" text-anchor="end">0.1 dB 判準</text><line x1="150.0" y1="430.0" x2="1120.0" y2="430.0" stroke="#435064" stroke-width="1.5"/><rect x="179.9" y="344.9" width="48.5" height="85.1" fill="#ff6b6b" rx="2" fill-opacity="0.85"/><text x="204.2" y="336.9" fill="#ff6b6b" font-size="11" font-weight="700" text-anchor="middle">0.12</text><rect x="233.3" y="247.0" width="48.5" height="183.0" fill="#00d4ff" rx="2" fill-opacity="0.85"/><text x="257.5" y="239.0" fill="#00d4ff" font-size="11" font-weight="700" text-anchor="middle">2.08</text><text x="230.8" y="454.0" fill="#9fb0c3" font-size="13" text-anchor="middle">1 mm</text><rect x="341.6" y="283.9" width="48.5" height="146.1" fill="#ff6b6b" rx="2" fill-opacity="0.85"/><text x="365.8" y="275.9" fill="#ff6b6b" font-size="11" font-weight="700" text-anchor="middle">0.71</text><rect x="394.9" y="247.0" width="48.5" height="183.0" fill="#00d4ff" rx="2" fill-opacity="0.85"/><text x="419.2" y="239.0" fill="#00d4ff" font-size="11" font-weight="700" text-anchor="middle">2.08</text><text x="392.5" y="454.0" fill="#9fb0c3" font-size="13" text-anchor="middle">2 mm</text><rect x="503.2" y="166.1" width="48.5" height="263.9" fill="#ff6b6b" rx="2" fill-opacity="0.85"/><text x="527.5" y="158.1" fill="#ff6b6b" font-size="11" font-weight="700" text-anchor="middle">21.95</text><rect x="556.6" y="247.0" width="48.5" height="183.0" fill="#00d4ff" rx="2" fill-opacity="0.85"/><text x="580.8" y="239.0" fill="#00d4ff" font-size="11" font-weight="700" text-anchor="middle">2.08</text><text x="554.2" y="454.0" fill="#9fb0c3" font-size="13" text-anchor="middle">4 mm</text><rect x="664.9" y="184.2" width="48.5" height="245.8" fill="#ff6b6b" rx="2" fill-opacity="0.85"/><text x="689.2" y="176.2" fill="#ff6b6b" font-size="11" font-weight="700" text-anchor="middle">12.95</text><rect x="718.3" y="247.0" width="48.5" height="183.0" fill="#00d4ff" rx="2" fill-opacity="0.85"/><text x="742.5" y="239.0" fill="#00d4ff" font-size="11" font-weight="700" text-anchor="middle">2.08</text><text x="715.8" y="454.0" fill="#9fb0c3" font-size="13" text-anchor="middle">8 mm</text><rect x="826.6" y="184.5" width="48.5" height="245.5" fill="#ff6b6b" rx="2" fill-opacity="0.85"/><text x="850.8" y="176.5" fill="#ff6b6b" font-size="11" font-weight="700" text-anchor="middle">12.83</text><rect x="879.9" y="247.0" width="48.5" height="183.0" fill="#00d4ff" rx="2" fill-opacity="0.85"/><text x="904.2" y="239.0" fill="#00d4ff" font-size="11" font-weight="700" text-anchor="middle">2.08</text><text x="877.5" y="454.0" fill="#9fb0c3" font-size="13" text-anchor="middle">16 mm</text><rect x="988.2" y="169.3" width="48.5" height="260.7" fill="#ff6b6b" rx="2" fill-opacity="0.85"/><text x="1012.5" y="161.3" fill="#ff6b6b" font-size="11" font-weight="700" text-anchor="middle">20.02</text><rect x="1041.6" y="247.0" width="48.5" height="183.0" fill="#00d4ff" rx="2" fill-opacity="0.85"/><text x="1065.8" y="239.0" fill="#00d4ff" font-size="11" font-weight="700" text-anchor="middle">2.08</text><text x="1039.2" y="454.0" fill="#9fb0c3" font-size="13" text-anchor="middle">無</text><text x="635.0" y="482.0" fill="#9fb0c3" font-size="13" text-anchor="middle">縫合 Via 間距</text><rect x="150.0" y="120.0" width="16.0" height="12.0" fill="#ff6b6b" rx="2"/><text x="174.0" y="131.0" fill="#9fb0c3" font-size="12.5">stripline（雙參考）</text><rect x="360.0" y="120.0" width="16.0" height="12.0" fill="#00d4ff" rx="2"/><text x="384.0" y="131.0" fill="#9fb0c3" font-size="12.5">微帶線（單參考）</text><rect x="24.0" y="470.0" width="1192.0" height="122.0" fill="#131c27" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="498.0" fill="#e8eef6" font-size="15" font-weight="700">工具目前怎麼處理</text><text x="44.0" y="522.0" fill="#ff6b6b" font-size="13">雙參考（stripline）缺縫合：判 D 級，硬性擋下。</text><text x="44.0" y="544.0" fill="#00d4ff" font-size="13">單參考（微帶線）缺縫合：出風險提示，不影響評級。</text><text x="44.0" y="570.0" fill="#9fb0c3" font-size="12.5">同間距下 stripline 的偏差是微帶線的 6.2 倍（中位數）；微帶線最差 2.08 dB。要不要改評級看這兩個數字。</text><text x="1206.0" y="608.0" fill="#6f8195" font-size="11" text-anchor="end">此工具由虎門科技資深技術工程師 Jeff Hong 洪敬傑提供</text></svg>