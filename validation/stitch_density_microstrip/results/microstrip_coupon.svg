<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1104"><style>text{font-family:Calibri,"Microsoft JhengHei",sans-serif}</style><rect x="0.0" y="0.0" width="1240.0" height="1104.0" fill="#0b1119" rx="16"/><text x="34.0" y="46.0" fill="#e8eef6" font-size="27" font-weight="700">微帶線的切面縫合密度</text><text x="34.0" y="74.0" fill="#9fb0c3" font-size="14">40 × 12 mm 微帶線，於 x=20 mm 切一刀分兩段各自求解再串接，與同一求解器的整片結果比較。</text><text x="34.0" y="98.0" fill="#6f8195" font-size="12">線寬 0.51 mm（50 Ω）。只有縫合 Via 的間距不同，其餘幾何完全相同。</text><text x="44.0" y="136.0" fill="#e8eef6" font-size="15" font-weight="700">截面</text><rect x="202.3" y="150.0" width="69.5" height="12.0" fill="#00d4ff" rx="2"/><text x="440.0" y="160.0" fill="#9fb0c3" font-size="11.5">SIG（微帶線走線）</text><rect x="44.0" y="162.0" width="386.0" height="34.0" fill="#1a2430" rx="2" stroke="#2a3646" stroke-width="1"/><text x="440.0" y="183.0" fill="#9fb0c3" font-size="11.5">介質 250 µm</text><rect x="44.0" y="196.0" width="386.0" height="12.0" fill="#c98b4b" rx="2"/><text x="440.0" y="206.0" fill="#9fb0c3" font-size="11.5">GND_1（參考面）</text><rect x="44.0" y="208.0" width="386.0" height="46.0" fill="#1a2430" rx="2" stroke="#2a3646" stroke-width="1"/><text x="440.0" y="235.0" fill="#9fb0c3" font-size="11.5">介質 400 µm</text><rect x="44.0" y="254.0" width="386.0" height="12.0" fill="#c98b4b" rx="2"/><text x="440.0" y="264.0" fill="#9fb0c3" font-size="11.5">GND_2</text><line x1="105.8" y1="202.0" x2="105.8" y2="260.0" stroke="#ffd479" stroke-width="5" stroke-linecap="round"/><line x1="337.4" y1="202.0" x2="337.4" y2="260.0" stroke="#ffd479" stroke-width="5" stroke-linecap="round"/><text x="44.0" y="292.0" fill="#ffd479" font-size="11.5">黃色＝縫合 Via，只連 GND_1 與 GND_2</text><text x="44.0" y="314.0" fill="#6f8195" font-size="11.5">走線上面沒有平面，所以 is_stripline 為假、</text><text x="44.0" y="332.0" fill="#6f8195" font-size="11.5">工具只建一個 Gap Port。這才是微帶線。</text><text x="44.0" y="356.0" fill="#ffb020" font-size="11.5">兩個 GND 層是必要的：只有一個平面時，</text><text x="44.0"