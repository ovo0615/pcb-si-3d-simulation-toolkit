<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560"><style>text{font-family:Calibri,"Microsoft JhengHei",sans-serif}</style><rect x="0.0" y="0.0" width="1240.0" height="560.0" fill="#0b1119" rx="16"/><text x="34.0" y="46.0" fill="#e8eef6" font-size="27" font-weight="700">縫合間距決定切面的可用頻率上限</text><text x="34.0" y="74.0" fill="#9fb0c3" font-size="14">「可用上限」＝分段串接與整片求解的偏差首次超過 0.1 dB 的頻率。</text><text x="34.0" y="98.0" fill="#ffb020" font-size="12.5">要解到 20 GHz，即使 1 mm 間距也不夠——這是現行檢查完全沒有的概念。</text><line x1="140.0" y1="430.0" x2="1120.0" y2="430.0" stroke="#1b2634" stroke-width="1"/><text x="128.0" y="434.0" fill="#6f8195" font-size="11" text-anchor="end">0 GHz</text><line x1="140.0" y1="385.4" x2="1120.0" y2="385.4" stroke="#1b2634" stroke-width="1"/><text x="128.0" y="389.4" fill="#6f8195" font-size="11" text-anchor="end">2 GHz</text><line x1="140.0" y1="340.8" x2="1120.0" y2="340.8" stroke="#1b2634" stroke-width="1"/><text x="128.0" y="344.8" fill="#6f8195" font-size="11" text-anchor="end">4 GHz</text><line x1="140.0" y1="296.2" x2="1120.0" y2="296.2" stroke="#1b2634" stroke-width="1"/><text x="128.0" y="300.2" fill="#6f8195" font-size="11" text-anchor="end">6 GHz</text><line x1="140.0" y1="251.5" x2="1120.0" y2="251.5" stroke="#1b2634" stroke-width="1"/><text x="128.0" y="255.5" fill="#6f8195" font-size="11" text-anchor="end">8 GHz</text><line x1="140.0" y1="206.9" x2="1120.0" y2="206.9" stroke="#1b2634" stroke-width="1"/><text x="128.0" y="210.9" fill="#6f8195" font-size="11" text-anchor="end">10 GHz</text><line x1="140.0" y1="162.3" x2="1120.0" y2="162.3" stroke="#1b2634" stroke-width="1"/><text x="128.0" y="166.3" fill="#6f8195" font-size="11" text-anchor="end">12 GHz</text><line x1="140.0" y1="430.0" x2="1120.0" y2="430.0" stroke="#435064" stroke-width="1.5"/><line x1="238.0" y1="173.5" x2="434.0" y2="257.9" stroke="#00d4ff" stroke-width="2.5"/><line x1="434.0" y1="257.9" x2="630.0" y2="287.3" stroke="#00d4ff" stroke-width="2.5"/><line x1="630.0" y1="287.3" 