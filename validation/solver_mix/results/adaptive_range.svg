<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 766"><style>text{font-family:Calibri,"Microsoft JhengHei",sans-serif}</style><rect x="0.0" y="0.0" width="1240.0" height="766.0" fill="#0b1119" rx="16"/><text x="34.0" y="46.0" fill="#e8eef6" font-size="27" font-weight="700">HFSS 自適應範圍：掃頻上限的精度代價</text><text x="34.0" y="74.0" fill="#9fb0c3" font-size="14">同一片試片（含訊號 Via）、同一組掃頻 0.01–20 GHz，只改自適應設定。</text><text x="34.0" y="98.0" fill="#6f8195" font-size="12.5">以「單頻 20 GHz」為最收斂基準——它在比較頻點上網格最紮實。</text><text x="34.0" y="122.0" fill="#6f8195" font-size="12.5">判讀重點：自適應涵蓋的頻段之外，網格沒有被加密，結果會系統性偏離。</text><text x="430.0" y="168.0" fill="#9fb0c3" font-size="12.5">求解時間</text><text x="830.0" y="168.0" fill="#9fb0c3" font-size="12.5">20 GHz 插入損耗</text><text x="1090.0" y="168.0" fill="#9fb0c3" font-size="12.5">與收斂解的落差</text><rect x="24.0" y="196.0" width="1192.0" height="90.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="228.0" fill="#e8eef6" font-size="16.5" font-weight="700">寬頻 1–10 GHz</text><text x="44.0" y="252.0" fill="#6f8195" font-size="12">工具現行 BKM</text><text x="44.0" y="272.0" fill="#ffb020" font-size="11.5" font-weight="700">← 目前預設值</text><line x1="430.0" y1="240.0" x2="760.0" y2="240.0" stroke="#1b2634" stroke-width="13" stroke-linecap="round"/><line x1="430.0" y1="240.0" x2="519.7" y2="240.0" stroke="#00d4ff" stroke-width="13" stroke-linecap="round"/><text x="430.0" y="222.0" fill="#9fb0c3" font-size="12.5">6.5 分</text><text x="830.0" y="246.0" fill="#e8eef6" font-size="17">-2.498 dB</text><text x="1090.0" y="246.0" fill="#ff6b6b" font-size="17" font-weight="700">+3.208 dB</text><rect x="24.0" y="300.0" width="1192.0" height="90.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="332.0" fill="#e8eef6" font-size="16.5" font-weight="700">單頻 10 GHz</text><text x="44.0" y="356.0" fill="#6f8195" font-size="12">自適應只到一半</text><line x1="430.0" y1="344.0" x2="760.0" y2="344.0" stroke="#1b2634" stroke-width="13" stroke-linecap="round"/><line x1="430.0" y1="344.0" x2="549.7" y2="344.0" stroke="#00d4ff" stroke-width="13" stroke-linecap="round"/><text x="430.0" y="326.0" fill="#9fb0c3" font-size="12.5">8.7 分</text><text x="830.0" y="350.0" fill="#e8eef6" font-size="17">-4.759 dB</text><text x="1090.0" y="350.0" fill="#ffb020" font-size="17" font-weight="700">+0.948 dB</text><rect x="24.0" y="404.0" width="1192.0" height="90.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="436.0" fill="#e8eef6" font-size="16.5" font-weight="700">寬頻 1–20 GHz</text><text x="44.0" y="460.0" fill="#6f8195" font-size="12">涵蓋整個掃頻</text><line x1="430.0" y1="448.0" x2="760.0" y2="448.0" stroke="#1b2634" stroke-width="13" stroke-linecap="round"/><line x1="430.0" y1="448.0" x2="606.2" y2="448.0" stroke="#00d4ff" stroke-width="13" stroke-linecap="round"/><text x="430.0" y="430.0" fill="#9fb0c3" font-size="12.5">12.8 分</text><text x="830.0" y="454.0" fill="#e8eef6" font-size="17">-5.910 dB</text><text x="1090.0" y="454.0" fill="#76e38e" font-size="17" font-weight="700">-0.203 dB</text><rect x="24.0" y="508.0" width="1192.0" height="90.0" fill="#101822" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="540.0" fill="#e8eef6" font-size="16.5" font-weight="700">單頻 20 GHz</text><text x="44.0" y="564.0" fill="#6f8195" font-size="12">自適應於上限</text><line x1="430.0" y1="552.0" x2="760.0" y2="552.0" stroke="#1b2634" stroke-width="13" stroke-linecap="round"/><line x1="430.0" y1="552.0" x2="760.0" y2="552.0" stroke="#00d4ff" stroke-width="13" stroke-linecap="round"/><text x="430.0" y="534.0" fill="#9fb0c3" font-size="12.5">24.0 分</text><text x="830.0" y="558.0" fill="#e8eef6" font-size="17">-5.707 dB</text><text x="1090.0" y="558.0" fill="#6f8195" font-size="15">基準</text><rect x="24.0" y="608.0" width="1192.0" height="92.0" fill="#131c27" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="634.0" fill="#ff6b6b" font-size="14">現行 BKM 在 20 GHz 少算了 3.2 dB 的損耗——看起來「比較好」，其實是網格不足。</text><text x="44.0" y="658.0" fill="#76e38e" font-size="14">兩個收斂設定彼此只差 0.2 dB（寬頻 1–20 與單頻 20），但寬頻只要一半時間。</text><text x="44.0" y="682.0" fill="#9fb0c3" font-size="13">參考：同一片試片 SIwave 在 20 GHz 為 -1.678 dB——與未收斂的 HFSS 接近，容易誤判成「SIwave 不準」。</text><text x="1206.0" y="752.0" fill="#6f8195" font-size="11" text-anchor="end">此工具由虎門科技資深技術工程師 Jeff Hong 洪敬傑提供</text></svg>