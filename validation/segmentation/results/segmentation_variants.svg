<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800"><style>text{font-family:Calibri,"Microsoft JhengHei",sans-serif}</style><rect x="0.0" y="0.0" width="1180.0" height="800.0" fill="#0b1119" rx="16"/><text x="34.0" y="44.0" fill="#e8eef6" font-size="27" font-weight="700">驗證試片與變體示意</text><text x="34.0" y="72.0" fill="#9fb0c3" font-size="14">同一條 38 mm、50 Ω 對稱 Stripline。所有變體的疊構、材料、Port 與求解設定完全相同，唯一差異如各區標註。</text><text x="34.0" y="96.0" fill="#6f8195" font-size="12">紅點＝元件端 Port　橘虛線＝切面位置　銅色圓點＝接地縫合 Via</text><rect x="24.0" y="124.0" width="1132.0" height="216.0" fill="#101822" rx="12" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="156.0" fill="#e8eef6" font-size="19" font-weight="700">試片 A ── 無接地縫合 Via</text><text x="1136.0" y="156.0" fill="#ff6b6b" font-size="13.5" text-anchor="end">對照組：呈現問題</text><rect x="48.0" y="176.0" width="300.0" height="13.0" fill="#c98b4b" rx="0"/><text x="360.0" y="186.5" fill="#6f8195" font-size="11">GND_TOP　35 µm</text><rect x="48.0" y="189.0" width="300.0" height="40.0" fill="#1d2836" rx="0"/><text x="360.0" y="213.0" fill="#6f8195" font-size="11">介質 250 µm（εr 4.0、tanδ 0.005）</text><rect x="48.0" y="229.0" width="300.0" height="13.0" fill="#1d2836" rx="0"/><rect x="180.0" y="229.0" width="36.0" height="13.0" fill="#00d4ff" rx="0"/><text x="360.0" y="239.5" fill="#6f8195" font-size="11">SIG　35 µm　走線寬 0.2 mm</text><rect x="48.0" y="242.0" width="300.0" height="40.0" fill="#1d2836" rx="0"/><text x="360.0" y="266.0" fill="#6f8195" font-size="11">介質 250 µm</text><rect x="48.0" y="282.0" width="300.0" height="13.0" fill="#c98b4b" rx="0"/><text x="360.0" y="292.5" fill="#6f8195" font-size="11">GND_BOT　35 µm</text><text x="198.0" y="317.0" fill="#ff6b6b" font-size="12" text-anchor="middle">上下接地平面互不相連</text><rect x="620.0" y="198.0" width="326.0" height="62.0" fill="#131c27" rx="7" stroke="#435064" stroke-width="1"/><line x1="645.2" y1="229.0" x2="920.8" y2="229.0" stroke="#00d4ff" stroke-width="4.5" stroke-linecap="round"/><circle cx