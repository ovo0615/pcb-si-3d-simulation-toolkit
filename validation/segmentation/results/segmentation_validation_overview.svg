<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560"><style>text{font-family:Calibri,"Microsoft JhengHei",sans-serif}</style><rect x="0.0" y="0.0" width="1180.0" height="560.0" fill="#0b1119" rx="16"/><text x="34.0" y="44.0" fill="#e8eef6" font-size="27" font-weight="700">分段切板方法驗證總覽</text><text x="34.0" y="72.0" fill="#9fb0c3" font-size="14">指標：分段串接結果與「同一片不切、單體全 HFSS」的插入損耗偏差（0～10 GHz）。橫條為對數尺度，越短越好。</text><text x="590.0" y="118.0" fill="#6f8195" font-size="11" text-anchor="middle">0.01</text><text x="732.4" y="118.0" fill="#6f8195" font-size="11" text-anchor="middle">0.1</text><text x="874.8" y="118.0" fill="#6f8195" font-size="11" text-anchor="middle">1</text><text x="1060.0" y="118.0" fill="#6f8195" font-size="11" text-anchor="end">20 dB</text><line x1="831.9" y1="128.0" x2="831.9" y2="424.0" stroke="#ffb020" stroke-width="1.6" stroke-dasharray="5 4"/><text x="839.9" y="118.0" fill="#ffb020" font-size="11">0.5 dB 判定門檻</text><text x="34.0" y="172.0" fill="#e8eef6" font-size="15.5">試片 A ── 無縫合 Via，切面距 Port 19 mm</text><text x="34.0" y="194.0" fill="#6f8195" font-size="12">對照組：切面處上下參考平面未連通</text><text x="566.0" y="172.0" fill="#ff6b6b" font-size="14" font-weight="700" text-anchor="end">FAIL</text><line x1="590.0" y1="168.0" x2="1060.0" y2="168.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="590.0" y1="168.0" x2="1039.6" y2="168.0" stroke="#ff6b6b" stroke-width="12" stroke-linecap="round"/><text x="1027.6" y="173.0" fill="#12202b" font-size="12" font-weight="700" text-anchor="end">最大 14.387 dB　RMS 1.312 dB</text><text x="34.0" y="248.0" fill="#e8eef6" font-size="15.5">試片 B-1 ── 有縫合 Via，切面距 Port 19 mm</text><text x="34.0" y="270.0" fill="#6f8195" font-size="12">1.27 λ @10 GHz</text><text x="566.0" y="248.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="590.0" y1="244.0" x2="1060.0" y2="244.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="590.0" y1="244.0" x2="712.9" y2="244.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="726.9" y="249.0" fill="#9fb0c3" font-size="12">最大 0.073 dB　RMS 0.025 dB</text><text x="34.0" y="324.0" fill="#e8eef6" font-size="15.5">試片 B-2 ── 有縫合 Via，切面距 Port 4 mm</text><text x="34.0" y="346.0" fill="#6f8195" font-size="12">0.27 λ @10 GHz</text><text x="566.0" y="324.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="590.0" y1="320.0" x2="1060.0" y2="320.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="590.0" y1="320.0" x2="638.8" y2="320.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="652.8" y="325.0" fill="#9fb0c3" font-size="12">最大 0.022 dB　RMS 0.009 dB</text><text x="34.0" y="400.0" fill="#e8eef6" font-size="15.5">試片 B-3 ── 有縫合 Via，切面距 Port 1.5 mm</text><text x="34.0" y="422.0" fill="#6f8195" font-size="12">0.10 λ @10 GHz，貼近不連續點</text><text x="566.0" y="400.0" fill="#76e38e" font-size="14" font-weight="700" text-anchor="end">PASS</text><line x1="590.0" y1="396.0" x2="1060.0" y2="396.0" stroke="#1b2634" stroke-width="12" stroke-linecap="round"/><line x1="590.0" y1="396.0" x2="735.4" y2="396.0" stroke="#76e38e" stroke-width="12" stroke-linecap="round"/><text x="749.4" y="401.0" fill="#9fb0c3" font-size="12">最大 0.105 dB　RMS 0.037 dB</text><rect x="24.0" y="468.0" width="1132.0" height="48.0" fill="#131c27" rx="10" stroke="#2a3646" stroke-width="1"/><text x="44.0" y="498.0" fill="#e8eef6" font-size="14">結論：切面處的參考平面有接地縫合時，分段串接可重現單體全波求解至 0.1 dB 以內；缺少縫合時，同一切點的偏差達 14 dB。</text></svg>