name: CI

on:
  push:
    branches: [main, master, public-showcase]
  pull_request:
    branches: [main, master, public-showcase]

jobs:
  forbidden-paths:
    name: Forbid .venv / node_modules / .aedb in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files
        run: |
          set -e
          matches=$(git ls-files | grep -E '(^|/)(\.venv|node_modules)/|\.aedb(/|$)|\.aedt\.lock$' || true)
          if [ -n "$matches" ]; then
            echo "The following files must not be committed:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no .venv, node_modules, or .aedb files tracked."

  secret-and-path-scan:
    name: Sensitive path / credential scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for local paths, credentials, license info
        run: |
          set -e
          export LC_ALL=C
          EXCLUDES=":(exclude).git :(exclude).github/** :(exclude,glob)**/dist/** :(exclude,glob)**/*.min.js :(exclude,glob)**/package-lock.json :(exclude,glob)**/*.lock :(exclude,glob)**/*.svg :(exclude,glob)**/*.aedt :(exclude,glob)**/*.aedtz :(exclude)AGENTS.md :(exclude)README.en.md :(exclude)README.zh-TW.md :(exclude)docs/visual-assets.md"
          pattern='(^|[^A-Za-z])D:\\|(^|[^A-Za-z])C:\\Users|\\\\[A-Za-z0-9_.-]+\\|10\.[0-9]+\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|api[_-]?key|access[_-]?token|password|secret|private[_-]?key|license.?server|private-source'
          matches=$(git grep -I -n -i -E "$pattern" -- . $EXCLUDES || true)
          if [ -n "$matches" ]; then
            echo "Potential sensitive content found - review each line before merging:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no obvious sensitive paths or credentials found in tracked text files."

      # `customer` 拆成獨立一條規則，只對報告功能的原始碼豁免。
      #
      # 報告功能必須有「客戶名稱」這個欄位，因此 customer_name 與浮水印變數
      # {customer} 一定會出現在原始碼裡——那是識別字，不是外洩的客戶資料。
      # 關鍵字比對無法區分「欄位名」與「欄位值」，硬留著只會逼人關掉整條規則。
      #
      # 因此改為：這三個檔案不套用 customer 規則，其餘檔案照舊擋。真正會裝
      # 客戶資料的是執行期產生的報告工作區（report_workspace/、
      # report_manifest.json），已在下一條規則直接禁止追蹤——那才是防線所在。
      - name: Scan for customer references outside the report feature
        run: |
          set -e
          export LC_ALL=C
          EXCLUDES=":(exclude).git :(exclude).github/** :(exclude,glob)**/dist/** :(exclude,glob)**/package-lock.json :(exclude,glob)**/*.svg :(exclude)AGENTS.md :(exclude)README.en.md :(exclude)README.zh-TW.md :(exclude)docs/visual-assets.md"
          REPORT_SOURCES=":(exclude,glob)**/components/ReportCenter.tsx :(exclude,glob)**/reportTypes.ts :(exclude)一鍵HTML報告_操作與交接.md"
          matches=$(git grep -I -n -i -E 'customer' -- . $EXCLUDES $REPORT_SOURCES || true)
          if [ -n "$matches" ]; then
            echo "Customer references found outside the report feature - review before merging:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no customer references outside the report feature."

      - name: Reject .env / key files and report workspaces
        run: |
          set -e
          matches=$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.pem$|\.key$|id_rsa|(^|/)report_workspace/|(^|/)report_manifest\.json$' || true)
          if [ -n "$matches" ]; then
            echo "Credential-shaped files or report workspaces must not be committed:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no .env/credential files or report workspaces tracked."

  frontend-build:
    name: Frontend TypeScript build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Confirm dist/index.html is present after build
        run: test -f dist/index.html

  frontend-dist-tracked:
    name: frontend/dist is tracked in git (needed for Source ZIP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dist/index.html is tracked
        run: |
          set -e
          if ! git ls-files web_app/frontend/dist/index.html | grep -q index.html; then
            echo "web_app/frontend/dist/index.html is not tracked. GitHub 'Code -> Download ZIP' would ship without a usable build."
            exit 1
          fi
          echo "OK: frontend/dist is tracked."

  python-compile-check:
    name: Python compile check (skips if no .py files are tracked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all tracked Python files
        run: |
          set -e
          files=$(git ls-files '*.py' || true)
          if [ -z "$files" ]; then
            echo "No Python files tracked on this branch - skipping."
            exit 0
          fi
          python -m py_compile $files

  readme-link-check:
    name: README link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in README.md, README.en.md, README.zh-TW.md, 操作說明.md
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            README.md README.en.md README.zh-TW.md web_app/README.md 操作說明.md
          fail: true
